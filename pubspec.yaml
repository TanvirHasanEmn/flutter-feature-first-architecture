name: feature_first_architecture
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  flutter_riverpod: ^3.4.3
#  firebase_core: ^4.13.0
#  firebase_auth: ^6.5.7
#  cloud_firestore: ^6.8.0
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8
  logger: ^2.8.0
  intl: ^0.20.2
  flutter_stripe: ^14.1.0
  dio: ^5.11.1
  smooth_page_indicator: ^3.0.0
  pinput: ^6.0.2
  google_sign_in: ^6.2.2
  shimmer: ^4.0.0
  carousel_slider: ^5.1.2
  table_calendar: ^3.2.1
  image_picker: ^1.2.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4



flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/splash.png"
  min_sdk_android: 21

  adaptive_icon_background: "#0F1012"
  adaptive_icon_foreground: "assets/splash.png"
flutter_native_splash:
  color: "#0F1012"
  image: "assets/splash.png"
  android_12:
    color: "#0F1012"
    image: "assets/splash.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/splash.png